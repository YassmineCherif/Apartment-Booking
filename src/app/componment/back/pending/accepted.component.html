<div class="container mt-3">
  <h3 class="page-title">Pending Users</h3>

  <div *ngIf="loading">Loading...</div>
  <div *ngIf="error" class="text-danger">{{ error }}</div>

  <div *ngIf="!loading && pending.length > 0" class="table-card">
    <table class="table mb-0">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone Number</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of pending">
          <td>{{ user.prenom }} {{ user.nom }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.numerotelephone }}</td>
          <td>{{ user.user_role === 'CLIENT' ? 'Resident' : user.user_role }}</td>
          <td>
            <button class="btn btn-success btn-sm me-3" (click)="setApproval(user.id_user, true)">
              Accept
            </button>
            <button class="btn btn-danger btn-sm" (click)="setApproval(user.id_user, false)">
              Decline
            </button>
          </td>


        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading && pending.length === 0" class="text-muted">
    No pending users.
  </div>
</div>

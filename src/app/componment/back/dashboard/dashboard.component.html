<div class="container mt-3">
  <h3 class="page-title text-center mb-4">Update Profile</h3>

  <div class="card p-4 shadow-sm">
    <form (ngSubmit)="onSubmit()" #updateProfileForm="ngForm">

      <!-- Name -->
      <div class="mb-3">
        <label for="nom" class="form-label">First Name</label>
        <input
          type="text"
          id="nom"
          name="nom"
          class="form-control"
          [(ngModel)]="nom"
          required
        />
      </div>

      <!-- Surname -->
      <div class="mb-3">
        <label for="prenom" class="form-label">Last Name</label>
        <input
          type="text"
          id="prenom"
          name="prenom"
          class="form-control"
          [(ngModel)]="prenom"
          required
        />
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          [(ngModel)]="email"
          required
        />
      </div>

      <!-- Phone -->
      <div class="mb-3">
        <label for="numtel" class="form-label">Phone Number</label>
        <input
          type="text"
          id="numtel"
          name="numtel"
          class="form-control"
          [(ngModel)]="numtel"
          required
        />
      </div>

      <!-- Address -->
      <div class="mb-3">
        <label for="adresse" class="form-label">Address</label>
        <input
          type="text"
          id="adresse"
          name="adresse"
          class="form-control"
          [(ngModel)]="adresse"
        />
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label for="password" class="form-label">New Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          [(ngModel)]="password"
          placeholder="Enter new password"
        />
      </div>

      <!-- Confirm Password -->
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          class="form-control"
          [(ngModel)]="confirmPassword"
          placeholder="Confirm your password"
        />
      </div>

      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-success">Update Profile</button>
        <button type="button" class="btn btn-secondary" (click)="ngOnInit()">Reset</button>
      </div>

      <div class="mt-3">
        <p *ngIf="errorMessage" class="text-danger">{{ errorMessage }}</p>
        <p *ngIf="successMessage" class="text-success">{{ successMessage }}</p>
      </div>
    </form>
  </div>
</div>

<div class="container mt-3">
  <h3 class="page-title text-center mb-4">Mettre à jour le profil</h3>

  <div class="card p-4 shadow-sm">
    <form (ngSubmit)="onSubmit()" #updateProfileForm="ngForm">

      <!-- Nom -->
      <div class="mb-3">
        <label for="nom" class="form-label">Prénom</label>
        <input
          type="text"
          id="nom"
          name="nom"
          class="form-control"
          [(ngModel)]="nom"
          required
        />
      </div>

      <!-- Prénom -->
      <div class="mb-3">
        <label for="prenom" class="form-label">Nom de famille</label>
        <input
          type="text"
          id="prenom"
          name="prenom"
          class="form-control"
          [(ngModel)]="prenom"
          required
        />
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          [(ngModel)]="email"
          required
        />
      </div>

      <!-- Téléphone -->
      <div class="mb-3">
        <label for="numtel" class="form-label">Numéro de téléphone</label>
        <input
          type="text"
          id="numtel"
          name="numtel"
          class="form-control"
          [(ngModel)]="numtel"
          required
        />
      </div>

      <!-- Adresse -->
      <div class="mb-3">
        <label for="adresse" class="form-label">Adresse</label>
        <input
          type="text"
          id="adresse"
          name="adresse"
          class="form-control"
          [(ngModel)]="adresse"
        />
      </div>

      <!-- Mot de passe -->
      <div class="mb-3">
        <label for="password" class="form-label">Nouveau mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          [(ngModel)]="password"
          placeholder="Entrez le nouveau mot de passe"
        />
      </div>

      <!-- Confirmer le mot de passe -->
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          class="form-control"
          [(ngModel)]="confirmPassword"
          placeholder="Confirmez votre mot de passe"
        />
      </div>

      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-success">Mettre à jour</button>
        <button type="button" class="btn btn-secondary" (click)="ngOnInit()">Réinitialiser</button>
      </div>

      <div class="mt-3">
        <p *ngIf="errorMessage" class="text-danger">{{ errorMessage }}</p>
        <p *ngIf="successMessage" class="text-success">{{ successMessage }}</p>
      </div>
    </form>
  </div>
</div>

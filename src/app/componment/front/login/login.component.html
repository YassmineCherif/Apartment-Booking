<div class="container">
  <div class="heading">Se Connecter</div>

  <form (ngSubmit)="onSubmit()" class="form">
    <input required [(ngModel)]="login" name="login" class="input" type="text" placeholder="Identifiant">
    <input required [(ngModel)]="password" name="password" class="input" type="password" placeholder="Mot de passe">

    <span class="forgot-password"><a routerLink="/forgot">Mot de passe oublié ?</a></span>

    <input class="login-button" type="submit" value="Se Connecter">
  </form>

  <div class="social-account-container">
    <span class="title">Vous n'avez pas de compte ?</span>
    <div class="social-accounts">
      <a routerLink="/register" class="create-button">Créez-en un</a>
    </div>
  </div>

  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  </div>

</div>

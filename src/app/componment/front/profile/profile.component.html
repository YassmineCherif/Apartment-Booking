<div class="container mt-5">
  <h3 class="page-title mb-4">Modifier le profil</h3>

  <div class="card p-4 shadow-sm profile-card">
    <form (ngSubmit)="onSubmit()" #updateProfileForm="ngForm">

      <!-- Prénom -->
      <div class="mb-3 position-relative input-icon">
        <i class="bi bi-person-fill"></i>
        <input
          type="text"
          id="nom"
          name="nom"
          class="form-control"
          [(ngModel)]="nom"
          placeholder="Prénom"
          required
        />
      </div>

      <!-- Nom -->
      <div class="mb-3 position-relative input-icon">
        <i class="bi bi-person-badge-fill"></i>
        <input
          type="text"
          id="prenom"
          name="prenom"
          class="form-control"
          [(ngModel)]="prenom"
          placeholder="Nom"
          required
        />
      </div>

      <!-- Email -->
      <div class="mb-3 position-relative input-icon">
        <i class="bi bi-envelope-fill"></i>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          [(ngModel)]="email"
          placeholder="Email"
          required
        />
      </div>

      <!-- Numéro de téléphone -->
      <div class="mb-3 position-relative input-icon">
        <i class="bi bi-telephone-fill"></i>
        <input
          type="text"
          id="numtel"
          name="numtel"
          class="form-control"
          [(ngModel)]="numtel"
          placeholder="Numéro de téléphone"
        />
      </div>

      <!-- Adresse -->
      <div class="mb-3 position-relative input-icon">
        <i class="bi bi-geo-alt-fill"></i>
        <input
          type="text"
          id="adresse"
          name="adresse"
          class="form-control"
          [(ngModel)]="adresse"
          placeholder="Adresse"
        />
      </div>

      <!-- Nouveau mot de passe -->
      <div class="mb-3 position-relative input-icon">
        <i class="bi bi-lock-fill"></i>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          [(ngModel)]="password"
          placeholder="Nouveau mot de passe"
        />
      </div>

      <!-- Confirmer le mot de passe -->
      <div class="mb-3 position-relative input-icon">
        <i class="bi bi-lock-fill"></i>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          class="form-control"
          [(ngModel)]="confirmPassword"
          placeholder="Confirmer le mot de passe"
        />
      </div>

      <div class="d-flex justify-content-between mt-4">
        <button type="submit" class="btn btn-success btn-lg">Modifier le profil</button>
        <button type="button" class="btn btn-secondary btn-lg" (click)="ngOnInit()">Réinitialiser</button>
      </div>

      <div class="mt-3">
        <p *ngIf="errorMessage" class="text-danger fw-bold">{{ errorMessage }}</p>
        <p *ngIf="successMessage" class="text-success fw-bold">{{ successMessage }}</p>
      </div>
    </form>
  </div>
</div>

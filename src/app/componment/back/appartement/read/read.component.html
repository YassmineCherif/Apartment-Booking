<div class="container mt-3">
  <h3 class="page-title text-center mb-4">Gestion des Appartements</h3>

  <!-- Ligne de filtres : Pays, Résidence, Bloc -->
  <div class="row mb-3 align-items-center">
    <!-- Dropdown Pays -->
    <div class="col-md-4">
      <select class="form-select" [(ngModel)]="selectedPaysId" (change)="onPaysChange()">
        <option [ngValue]="undefined">-- Sélectionner un pays --</option>
        <option *ngFor="let p of paysList" [ngValue]="p.id_country">{{ p.pays }}</option>
      </select>
    </div>

    <!-- Dropdown Résidence -->
    <div class="col-md-4" *ngIf="selectedPaysId">
      <select class="form-select" [(ngModel)]="selectedResidenceId" (change)="onResidenceChange()">
        <option [ngValue]="undefined">-- Sélectionner une résidence --</option>
        <option *ngFor="let r of filteredResidences" [ngValue]="r.id_residence">{{ r.nom }}</option>
      </select>
    </div>

    <!-- Dropdown Bloc -->
    <div class="col-md-4" *ngIf="selectedResidenceId">
      <select class="form-select" [(ngModel)]="selectedBlocId" (change)="onBlocChange()">
        <option [ngValue]="undefined">-- Sélectionner un bloc --</option>
        <option *ngFor="let b of filteredBlocs" [ngValue]="b.id_bloc">{{ b.nom }}</option>
      </select>
    </div>
  </div>

  <!-- Recherche + bouton Ajouter -->
  <div class="row mb-3 align-items-center">
    <div class="col-md-8">
      <input type="text" class="form-control" placeholder="Rechercher par titre ou description"
             [(ngModel)]="searchTerm" (input)="filterAppartements()" />
    </div>
    <div class="col-md-4 text-end">
      <button class="btn btn-success" (click)="openCreateModal()">Ajouter un Appartement</button>
    </div>
  </div>

  <!-- Cartes des appartements -->
  <div class="row">
    <div *ngFor="let app of filteredAppartements" class="col-md-4 mb-3">
      <div class="card h-100 shadow-sm">
        <img [src]="app.image ? '/assets/' + app.image : '/assets/images/app1.png'" 
             class="card-img-top" alt="{{ app.titre }}">
        <div class="card-body">
          <h5 class="card-title">{{ app.titre }}</h5>
          <p class="card-text">
            {{ app.description }} <br>
            Bloc: {{ getBlocName(app.id_bloc) }}
          </p>
        </div>
        <div class="card-footer d-flex justify-content-between">
          <button class="btn btn-primary btn-sm" (click)="openEditModal(app)">Modifier</button>
          <button class="btn btn-danger btn-sm" (click)="supprimerAppartement(app.id_app)">Supprimer</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Création/Édition -->
<div class="modal fade" id="appartementModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog" style="margin-top: 150px;">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ appartementToUpdate?.id_app ? 'Modifier l\'Appartement' : 'Créer un Appartement' }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form *ngIf="appartementToUpdate">
          <div class="mb-3">
            <label class="form-label">Titre</label>
            <input type="text" class="form-control" [(ngModel)]="appartementToUpdate.titre" name="titre" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" [(ngModel)]="appartementToUpdate.description" name="description" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Bloc</label>
            <select class="form-select" [(ngModel)]="appartementToUpdate.id_bloc" name="id_bloc" required>
              <option [ngValue]="undefined">-- Sélectionner un bloc --</option>
              <option *ngFor="let b of blocsList" [ngValue]="b.id_bloc">{{ b.nom }}</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Image</label>
            <input type="file" class="form-control" (change)="onImageSelected($event)" />
            <small class="text-muted">L'image sera stockée dans assets/images</small>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-primary" (click)="saveAppartement()">
          {{ appartementToUpdate?.id_app ? 'Mettre à jour' : 'Créer' }}
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Toasts -->
<div class="toast-container position-fixed top-0 end-0 p-3">
  <div *ngFor="let toast of toasts" class="toast show" [ngClass]="toast.type">
    {{ toast.message }}
  </div>
</div>
